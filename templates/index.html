<!DOCTYPE html>
<html>
<head>
    <title>AI Study Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>📚 AI Study Buddy</h1>

    <form method="POST">

        <textarea
            name="question"
            placeholder="Enter your topic or question here..."
            required>
        </textarea>

        <br>

        <button type="submit">
            Ask AI
        </button>

    </form>

    <div class="answer">
        {{ answer }}
    </div>

</div>

</body>
</html>
